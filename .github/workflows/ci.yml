name: CI

on:
  push:
    branches: [main, 'week*/**']
    paths:
      - 'week4/day23/healthy-app/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    branches: [main]
    paths:
      - 'week4/day23/healthy-app/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/docker-build-push.yml'

defaults:
  run:
    working-directory: week4/day23/healthy-app

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run flake8
        run: flake8 app.py tests/

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      image-name: healthy-app
      build-context: ./week4/day23/healthy-app
      aws-region: us-east-1
      role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-ecr-push
