name: Reusable - Docker Build and Push to ECR

on:
  workflow_call:
    inputs:
      image-name:
        description: "ECR repository name"
        required: true
        type: string
      build-context:
        description: "Path to Docker build context (relative to repo root)"
        required: true
        type: string
      aws-region:
        description: "AWS region for ECR"
        required: false
        type: string
        default: "us-east-1"
      role-arn:
        description: "IAM role ARN to assume via OIDC"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.build-context }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ inputs.image-name }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ inputs.image-name }}:latest
